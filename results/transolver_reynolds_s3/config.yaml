seed: 3
tag: null
device: auto
model:
  name: transolver
  dim: 128
  n_layers: 4
  n_heads: 8
  n_slices: 32
  ffn_mult: 4
  n_freqs: 6
  activation: gelu
  slice_temperature: 0.5
  trunk_dim: 256
  coef_hidden: 256
  coef_layers: 2
  coef_pooling: ds_mean_max
train:
  epochs: 400
  lr: 0.001
  batch_size: 16
  weight_decay: 0.0
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-06
  grad_clip: 1.0
  num_workers: 0
  val_every: 1
  val_metric: val_loss
  val_metric_mode: min
  weights:
    head: 0.1
    force: 0.0
    sym: 0.0
    bc: 0.0
    div: 0.0
  warmup_epochs: 0
data:
  split: reynolds
  splits_dir: data/splits
  processed_dir: /kaggle/input/datasets/cocomo069/airfrans-cache/processed/airfrans
  norm_stats: /kaggle/input/datasets/cocomo069/airfrans-cache/processed/airfrans/norm_stats.json
  load_volume: false
  cache_in_ram: true
paths:
  results_root: results
  checkpoints_root: checkpoints
eval:
  batch_size: 8
  compute_symmetry: true
  symmetry_max_sims: 64
_meta:
  config_path: configs/transolver.yaml
  overrides:
  - train.batch_size=16
  - split=reynolds
  - seed=3
  - data.processed_dir=/kaggle/input/datasets/cocomo069/airfrans-cache/processed/airfrans
  - data.norm_stats=/kaggle/input/datasets/cocomo069/airfrans-cache/processed/airfrans/norm_stats.json
  - paths.results_root=results
  run_id: transolver_reynolds_s3
