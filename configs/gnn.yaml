# M1 -- kNN message-passing GNN over airfoil surface points (CONTEXT.md 7).
# Split and seed come from CLI overrides:
#   .venv/Scripts/python.exe -m scripts.train --config configs/gnn.yaml split=full seed=0

model:
  name: gnn
  hidden_dim: 128
  mlp_hidden: 192
  n_rounds: 8            # message-passing rounds
  k: 16                  # kNN degree (CONTEXT.md 7: k=16)
  n_freqs: 6             # Fourier positional-encoding frequencies
  activation: gelu
  aggr: mean
  layer_norm: true
  trunk_dim: 128
  coef_hidden: 256
  coef_layers: 2
  coef_pooling: ds_mean_max

train:
  epochs: 400            # CONTEXT.md 10 default; cut via epochs=N for budget runs
  lr: 1.0e-3
  batch_size: 16
  weight_decay: 0.0
  optimizer: adam
  scheduler: cosine      # Adam + cosine schedule (CONTEXT.md 10)
  min_lr: 1.0e-6
  warmup_epochs: 0
  grad_clip: 1.0         # fp32 only, no AMP on Pascal (CONTEXT.md 1)
  num_workers: 0         # <= 2 by user constraint
  val_every: 1
  val_metric: val_loss
  val_metric_mode: min
  weights:               # loss lambdas (CONTEXT.md 8)
    head: 0.1            # lambda_H, D-016: coefficient-head regression, ALWAYS on
    force: 0.0           # lambda_F, force self-consistency (ablation axis)
    sym: 0.0             # lambda_S, symmetry residual (ablation axis)
    bc: 0.0
    div: 0.0

data:
  split: full
  splits_dir: data/splits
  processed_dir: data/processed/airfrans
  norm_stats: data/processed/airfrans/norm_stats.json
  load_volume: false
  cache_in_ram: true

eval:
  batch_size: 8
  compute_symmetry: true
  symmetry_max_sims: 64

seed: 0
tag: null
device: auto
