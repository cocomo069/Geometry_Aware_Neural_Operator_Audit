# M2 -- GINO-lite: kernel encoder -> FNO2d on a 64x64 SDF-conditioned latent
# grid -> kernel decoder back to surface points (CONTEXT.md 7).  Self-implemented;
# no `neuraloperator` dependency.

model:
  name: sdf_fno
  width: 32              # FNO channel width (CONTEXT.md 7)
  modes: 16              # retained Fourier modes per direction
  n_fno_layers: 4
  spectral_groups: 4     # grouped spectral mixing, keeps params near 1.5 M
  fno_residual: true
  grid_res: [64, 64]     # (n_y, n_x)
  bbox: [-0.5, 1.5, -1.0, 1.0]
  bbox_mode: fixed
  conditioning: sdf      # ablation axis: sdf | mask | sdf+normals
  k_enc: 8
  k_dec: 8
  enc_radius_cells: 4.0
  kernel_hidden: 128
  point_hidden: 128
  n_freqs: 6
  activation: gelu
  use_external_sdf: true
  trunk_dim: 256
  coef_hidden: 256
  coef_layers: 2
  coef_pooling: ds_mean_max

train:
  epochs: 400
  lr: 1.0e-3
  batch_size: 16
  weight_decay: 0.0
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-6
  warmup_epochs: 0
  grad_clip: 1.0
  num_workers: 0
  val_every: 1
  val_metric: val_loss
  val_metric_mode: min
  weights:
    head: 0.1            # lambda_H, D-016: coefficient-head regression, ALWAYS on
    force: 0.0
    sym: 0.0
    bc: 0.0
    div: 0.0

data:
  split: full
  splits_dir: data/splits
  processed_dir: data/processed/airfrans
  norm_stats: data/processed/airfrans/norm_stats.json
  load_volume: false
  cache_in_ram: true

eval:
  batch_size: 4          # latent grids are the VRAM driver on the 4 GB P2000
  compute_symmetry: true
  symmetry_max_sims: 64

seed: 0
tag: null
device: auto
