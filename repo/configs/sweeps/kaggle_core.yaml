# Core grid on Kaggle P100 (PLAN.md Phase 3.1): 3 models x 6 splits x seed 0.
# batch_size=16 uniformly (D-019): matched across models per contribution C2 and
# sized to the 16 GB P100, ~2-4 h/run vs the frozen 4 GB configs' 8/8/4.
# Model-major order: a truncated session yields complete model rows.
name: kaggle_core
defaults:
  overrides: [train.batch_size=16]
matrix:
  config: [configs/gnn.yaml, configs/transolver.yaml, configs/sdf_fno.yaml]
  overrides:
    split: [full, scarce, reynolds, aoa, shape5, combined]
    seed: [0]
